name: CI

on:
  pull_request:
  push:
    branches:
      # `blueprint` is the fork's product/default branch — the revision consumers pin
      # (CX-008). Push runs give each shipped head linkable build/test evidence, not
      # only the pre-merge PR checks. Release-line branches keep their own coverage.
      - blueprint
      - v*

permissions:
  contents: read

jobs:
  blueprint-build:
    name: Blueprint Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake package cache
        uses: actions/cache@v5
        with:
          path: |
            .lake/packages/mathlib
            .lake/packages/verso
          key: ${{ runner.os }}-lake-packages-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-packages-v2-
      - name: Restore Lake dependency build cache
        uses: actions/cache@v5
        with:
          path: |
            .lake/packages/mathlib/.lake/build
            .lake/packages/verso/.lake/build
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-
      - name: Show tool versions
        run: |
          lean --version
          lake --version
          python3 --version
      - name: Build package
        run: ./scripts/lean-low-priority lake build

  blueprint-tests:
    name: Blueprint Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake package cache
        uses: actions/cache@v5
        with:
          path: |
            .lake/packages/mathlib
            .lake/packages/verso
          key: ${{ runner.os }}-lake-packages-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-packages-v2-
      - name: Restore Lake dependency build cache
        uses: actions/cache@v5
        with:
          path: |
            .lake/packages/mathlib/.lake/build
            .lake/packages/verso/.lake/build
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-
      - name: Run Lean tests
        run: ./scripts/run-lean-tests.sh
      - name: Run consumer math lint smoke
        run: python3 ./scripts/check_math_lint_fresh_repo.py

  harness-tests:
    name: Harness Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Python harness tests
        run: python3 -m unittest discover -s tests/harness -p 'test_*.py'
      - name: Check Python harness syntax
        run: python3 -m compileall -q scripts

  header-provenance:
    name: Header Provenance (CX-004)
    runs-on: ubuntu-latest
    steps:
      # Full history so the upstream v4.32.0 baseline commit is present for the
      # lineage check.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fork-original files must not carry the upstream header template
        run: ./scripts/check-header-provenance.sh

  js-api-tooling:
    name: JavaScript API Tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Typecheck JavaScript API
        run: npm run typecheck
      - name: Build JavaScript API declarations
        run: npm run build:types
      - name: Check JavaScript API declarations
        run: npm run check:types
      # CI validates the generated API docs and uploads them as a review artifact.
      # The Pages deployment workflow rebuilds its own published copy.
      - name: Generate and check JavaScript API docs
        run: ./scripts/generate-js-api-docs.sh
      - name: Upload JavaScript API docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: js-api-docs
          path: _out/jsdoc-api

  project-template-fresh-repo:
    name: Project Template Fresh Repo
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned by DIGEST, not `:latest`: this was the last unpinned `uses:` in
      # the workspace, and an image tag is a mutable pointer to whatever was
      # pushed last. Resolved from the Docker Hub registry API; `latest` and
      # `1.7.12` name the same manifest today. Bump deliberately.
      #
      # `.github/actionlint.yaml` suppresses exactly one diagnostic class: this
      # actionlint's model of the `job` context predates `job.workflow_sha` and
      # its three siblings, which the reusable workflows depend on. The config
      # says why, and says what to check when removing it.
      - name: Lint GitHub workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667  # 1.7.12
        with:
          # `blueprint-pages.yml` is gone (a dead `workflow_call` design with a
          # local-path caller, references to a nonexistent tools/verso-harness/,
          # zero gates and zero adopters); `blueprint-verify.yml` and
          # `blueprint-deploy.yml` replace it. `project_template/`'s copy of that
          # dead file and its `pages.yml` caller are gone too: the starter now
          # ships the two thin callers every consumer ships, which reference this
          # repository by SHA and nothing local, so they are linted here — the
          # starter's workflows are the ones a stranger receives.
          #
          # `reference-blueprints.yml`, `reference-blueprints-deploy.yml` and
          # `backport-discipline.yml` are gone too — upstream policies this fork does
          # not operate, never run here. `.github/workflows/README.md` records which
          # workflows are ours and why those three left; keep this list in step with
          # the directory.
          args: .github/workflows/ci.yml .github/workflows/blueprint-verify.yml .github/workflows/blueprint-deploy.yml project_template/.github/workflows/ci.yml project_template/.github/workflows/deploy.yml
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Show tool versions
        run: |
          lean --version
          lake --version
          python3 --version
      # CX-009/010: copy the UNMODIFIED distributed template out-of-tree and resolve it with NO
      # `lake update`. Fails if Lake reports "manifest out of date", rewrites the committed
      # manifest, or resolves any dependency to a revision/origin other than the committed pin.
      # `--build` additionally compiles the pinned dependency stack to prove the pins build
      # standalone (cold build; the dependency compile is also covered by the Blueprint Build job)
      # and then RENDERS the starter through its own scripts/ci-pages.sh, gating the site on
      # structure and the off-origin rule. The rendering half is not optional polish: resolution
      # and dependency-compile checks read the template's pins and never its content, which is how
      # a starter chapter using a directive no expander registers, and a `uses` graph the
      # connectivity gate rejects, both shipped past a green check. Elaborating the chapters and
      # running the graph gates happens only when the site is actually generated.
      - name: Fresh-repo template resolves the committed pins and renders (no lake update)
        run: python3 ./scripts/check_project_template_fresh_repo.py --build
