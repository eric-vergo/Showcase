name: Deploy

# Pages serves the release asset the committed pin names, and only after the deploy workflow
# has verified the asset's digest against that pin and authenticated the pin against this
# checkout. Pinned to the same Showcase commit as `ci.yml` and `lakefile.lean`.

on:
  push:
    branches: [main]
    # Only the pin. A change to the workflow or its scripts without a new pin is re-verified
    # by hand, not by a run that would refuse an unchanged release.
    paths:
      - 'trust/site-build.json'
  # How the verify workflow's `site-release` job hands off. Dispatching a run of this
  # file directly (`gh workflow run deploy.yml`) needs `actions: write`, which no caller
  # grants it, so that route failed at startup before a step ever ran; a
  # `repository_dispatch` needs only `contents: write`, which the release step already
  # holds. GitHub serves `repository_dispatch` from the DEFAULT branch's copy of this
  # workflow, so the pin it deploys is the one on `main` — the same one the `push`
  # trigger above would deploy.
  repository_dispatch:
    types: [blueprint-site-pin]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: eric-vergo/Showcase/.github/workflows/blueprint-deploy.yml@6dd4a5f812d0f4338dc432c5efebf8ce47e260a0
    with:
      showcase_sha: "6dd4a5f812d0f4338dc432c5efebf8ce47e260a0"
      publish_branch: main
      site_dir: "."
      site_pin: trust/site-build.json
      # Read off a real build (182 files), never copied: page slugs derive from page TITLES.
      # Every path here is a surface that probes and degrades — the generator writes it only
      # when its inputs were read — so its absence is a silent regression, not an error.
      required_site_files: >-
        index.html -verso-data/blueprint-manifest.json -verso-data/trust-provenance.json
        Dependency-Graph/index.html Showcase-Summary/index.html
        Formalization-Metadata/index.html Trust-model/index.html comparator/index.html
        pm/index.html
      min_site_files: 120
